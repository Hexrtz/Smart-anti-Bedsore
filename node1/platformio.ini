; Node1: เซนเซอร์แรงกด FSR402 x6 + สายดึงฉุกเฉิน
; เจ้าของ: Natthasit Wongprang
[env:node1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared            ; ใช้ค่าคงที่จาก shared/config.h
; ถ้าเสียบสาย USB ที่ช่อง "USB" (ไม่ใช่ "COM"/"UART") แล้ว Serial Monitor ไม่ขึ้นอะไร
; ให้เปิดบรรทัดข้างล่างนี้ (ลบ ; หน้าบรรทัด) แล้วอัปโหลดใหม่
;    -DARDUINO_USB_CDC_ON_BOOT=1
