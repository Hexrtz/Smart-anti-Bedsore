; Node1: เซนเซอร์แรงกด FSR402 x6 + สายดึงฉุกเฉิน
; เจ้าของ: Natthasit Wongprang
[env:node1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../shared            ; ใช้ค่าคงที่จาก shared/config.h
; Serial ออกทางช่อง "USB" (native USB ของ ESP32-S3) ที่ทีมใช้เสียบอยู่
; ถ้าเปลี่ยนไปเสียบช่อง "COM"/"UART" แล้ว Serial Monitor ไม่ขึ้นอะไร ให้ปิดบรรทัดนี้ (ใส่ ; หน้าบรรทัด)
    -DARDUINO_USB_CDC_ON_BOOT=1
